<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#64748b;--accent:#2563eb;--good:#15803d;--bad:#dc2626;--line:#dbe3ef;--notice:#fff7ed;--noticeLine:#fdba74}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,#0f172a,#2563eb);color:#fff;padding:30px 16px}.wrap{max-width:950px;margin:auto}
h1{margin:0;font-size:clamp(25px,5vw,40px)}.sub{opacity:.88;margin-top:6px}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.progress{height:5px;background:#e5e7eb}.bar{height:100%;width:0;background:var(--accent)}.controls{max-width:950px;margin:auto;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#e8eef8;color:#1e3a8a}
main{padding:20px 14px 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 8px 25px rgba(15,23,42,.05)}
.notice{background:var(--notice);border:1px solid var(--noticeLine);padding:15px;border-radius:12px;margin:15px 0}
.passage{background:#f8fafc;border:1px solid var(--line);padding:18px;border-radius:14px;margin-bottom:20px;white-space:pre-line}
.passage h2{margin-top:0;font-size:20px}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.num{font-weight:900;color:var(--accent)}
.question{font-size:18px;font-weight:800;margin:12px 0}.hint{font-size:13px;color:var(--muted);margin-bottom:10px}
.option{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);padding:13px;border-radius:12px;margin:9px 0;cursor:pointer}
.option input{margin-top:6px}.option.correct{border-color:#86efac;background:#f0fdf4}.option.wrong{border-color:#fca5a5;background:#fef2f2}
.feedback{display:none;margin-top:14px;padding:14px;border-radius:12px}.feedback.show{display:block}.good{background:#ecfdf5;border:1px solid #86efac;color:#166534}.bad{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b}
.result{display:none;text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:20px}.result.show{display:block}.score{font-size:46px;font-weight:950;color:var(--accent)}.small{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header><div class="wrap"><h1>Quiz TKA Ekonomi</h1><div class="sub">25 Soal • Studi Kasus & Soal Kompleks • Feedback Benar/Salah • Pembahasan</div></div></header>
<div class="top"><div class="progress"><div id="bar" class="bar"></div></div><div class="controls"><span id="counter">0/25 dijawab</span><div><button class="secondary" onclick="resetQuiz()">Reset</button> <button class="primary" onclick="finishQuiz()">Lihat Nilai</button></div></div></div>
<main class="wrap">
<div class="card"><b>Petunjuk Kerjasama:</b><p>Bacalah setiap studi kasus dengan cermat sebelum menjawab. Tekan <b>Periksa Jawaban</b> di tiap nomor untuk melihat jawaban yang benar beserta pembahasannya secara langsung.</p></div>
<div id="quiz"></div><div id="result" class="result"></div>
</main>
<script>
const questions=[
 {"n": 1, "type": "single", "q": "Berdasarkan studi kasus krisis ekonomi Sri Lanka, faktor utama yang memicu krisis cadangan devisa hingga gagal bayar utang luar negeri adalah ....", "options": ["Penurunan tajam pendapatan sektor pariwisata dan kebijakan pemotongan pajak yang tidak terencana", "Kenaikan ekspor teh dan karet yang tidak terkendali", "Peningkatan investasi asing langsung di sektor manufaktur", "Penguatan nilai tukar mata uang lokal terhadap Dolar AS", "Pengurangan jumlah impor barang mewah secara berlebihan"], "answer": [0], "why": "Sri Lanka mengalami krisis akibat anjloknya sektor pariwisata saat pandemi, dipadu dengan kebijakan pemangkasan pajak ekstrem dan larangan pupuk kimia yang merusak hasil pertanian ekspor."},
 {"n": 2, "type": "multi", "q": "Manakah dari langkah berikut yang termasuk kebijakan pemerintah yang tepat untuk mengatasi hyperinflation akibat krisis ekonomi? (Pilih semua yang benar)", "options": ["Menaikkan suku bunga acuan bank sentral", "Mencetak uang kertas baru sebanyak-banyaknya untuk membayar utang", "Mengurangi pengeluaran/belanja pemerintah", "Memperketat pemberian kredit kepada masyarakat", "Memberikan subsidi tanpa batas untuk seluruh barang konsumsi"], "answer": [0, 2, 3], "why": "Hyperinflation diatasi dengan kebijakan moneter ketat (menaikkan suku bunga, memperketat kredit) dan kebijakan fiskal kontraktif (mengurangi belanja pemerintah). Mencetak uang berlebih justru memperparah inflasi."},
 {"n": 3, "type": "single", "q": "Seorang pengusaha muda di era krisis harus memilih antara melanjutkan pendidikan S2 dengan biaya Rp50.000.000 atau membuka usaha kedai kopi yang diproyeksikan menghasilkan keuntungan Rp70.000.000 per tahun. Jika ia memilih melanjutkan S2, maka biaya peluangnya (opportunity cost) adalah ....", "options": ["Rp50.000.000", "Rp70.000.000", "Rp120.000.000", "Rp20.000.000", "Rp0"], "answer": [1], "why": "Opportunity cost adalah nilai dari alternatif terbaik yang dikorbankan. Karena ia memilih S2, maka potensi keuntungan dari kedai kopi sebesar Rp70.000.000 yang dikorbankan adalah biaya peluangnya."},
 {"n": 4, "type": "multi", "q": "Manakah dari pernyataan berikut yang menggambarkan ciri-ciri sistem ekonomi pasar (kapitalis)? (Pilih semua yang benar)", "options": ["Semua sumber daya produksi dikuasai oleh negara", "Adanya persaingan bebas antar produsen", "Hak milik pribadi atas alat-alat produksi diakui", "Mekanisme harga ditentukan oleh interaksi permintaan dan penawaran", "Pemerintah menentukan jenis dan jumlah barang yang diproduksi"], "answer": [1, 2, 3], "why": "Sistem ekonomi pasar ditandai oleh kebebasan kepemilikan modal/alat produksi, persaingan bebas, dan penetapan harga melalui mekanisme pasar."},
 {"n": 5, "type": "single", "q": "Pergeseran kurva permintaan suatu barang ke kanan dapat disebabkan oleh ....", "options": ["Penurunan harga barang itu sendiri", "Peningkatan harga barang substitusi", "Penurunan pendapatan masyarakat untuk barang normal", "Perubahan selera konsumen yang semakin menurun terhadap barang tersebut", "Kenaikan harga barang komplementer"], "answer": [1], "why": "Jika harga barang substitusi (pengganti) naik, konsumen beralih membeli barang ini, sehingga kurva permintaan barang ini bergeser ke kanan (meningkat)."},
 {"n": 6, "type": "multi", "q": "Faktor-faktor yang dapat menyebabkan kurva penawaran bergeser ke kiri adalah .... (Pilih semua yang benar)", "options": ["Kenaikan harga bahan baku produksi", "Penerapan teknologi modern yang lebih efisien", "Peningkatan pajak usaha oleh pemerintah", "Ekspektasi kenaikan harga di masa depan oleh produsen", "Pemberian subsidi produksi oleh pemerintah"], "answer": [0, 2, 3], "why": "Kurva penawaran bergeser ke kiri (penawaran berkurang) saat biaya produksi naik (harga bahan baku & pajak naik) atau saat produsen menahan barang karena menanti harga naik di masa depan."},
 {"n": 7, "type": "single", "q": "Jika koefisien elastisitas harga permintaan ($E_d$) suatu barang adalah $2,5$, maka barang tersebut bersifat ....", "options": ["Inelastis sempurna", "Inelastis", "Uniter", "Elastis", "Elastis sempurna"], "answer": [3], "why": "Nilai elastisitas $E_d > 1$ menunjukkan bahwa permintaan bersifat elastis (perubahan harga berpengaruh signifikan terhadap jumlah barang yang diminta)."},
 {"n": 8, "type": "single", "q": "Diketahui fungsi permintaan $Q_d = 100 - 2P$ dan fungsi penawaran $Q_s = -20 + 4P$. Harga keseimbangan ($P$) pasar tersebut adalah ....", "options": ["$P = 15$", "$P = 20$", "$P = 25$", "$P = 30$", "$P = 40$"], "answer": [1], "why": "Keseimbangan pasar terjadi saat $Q_d = Q_s \Rightarrow 100 - 2P = -20 + 4P \Rightarrow 120 = 6P \Rightarrow P = 20$."},
 {"n": 9, "type": "multi", "q": "Manakah komponen yang dihitung dalam pendapatan nasional menggunakan pendekatan pengeluaran? (Pilih semua yang benar)", "options": ["Konsumsi Rumah Tangga ($C$)", "Sewa Tanah ($r$)", "Investasi Swasta ($I$)", "Pengeluaran Pemerintah ($G$)", "Ekspor Netto ($X - M$)"], "answer": [0, 2, 3, 4], "why": "Rumus Pendapatan Nasional Pendekatan Pengeluaran adalah $Y = C + I + G + (X - M)$. Sewa tanah ($r$) adalah komponen pendekatan penerimaan."},
 {"n": 10, "type": "single", "q": "Suatu negara memiliki GNP sebesar Rp5.000 Triliun, penyusutan barang modal Rp400 Triliun, pajak tidak langsung Rp300 Triliun, dan subsidi Rp50 Triliun. Besarnya NNI (Net National Income) adalah ....", "options": ["Rp4.600 Triliun", "Rp4.350 Triliun", "Rp4.250 Triliun", "Rp4.300 Triliun", "Rp4.700 Triliun"], "answer": [1], "why": "$NNP = GNP - \text{Penyusutan} = 5.000 - 400 = 4.600$. $NNI = NNP - \text{Pajak Tidak Langsung} + \text{Subsidi} = 4.600 - 300 + 50 = 4.350$ Triliun."},
 {"n": 11, "type": "multi", "q": "Manakah instrumen kebijakan moneter yang bersifat kontraktif (tight money policy)? (Pilih semua yang benar)", "options": ["Menaikkan tingkat suku bunga acuan (Discount Rate)", "Menjual Surat Berharga Negara (SBN) ke masyarakat", "Menaikkan rasio cadangan kas minimum (Reserve Requirement)", "Membeli obligasi pemerintah dari bank umum", "Mempermudah syarat kredit bagi nasabah"], "answer": [0, 1, 2], "why": "Kebijakan moneter kontraktif bertujuan mengurangi jumlah uang beredar dengan cara menaikkan suku bunga, menjual surat berharga, dan menaikkan cadangan kas minimum."},
 {"n": 12, "type": "single", "q": "Tarik-menarik antara permintaan barang berlebih yang tidak seimbang dengan kapasitas produksi nasional mengakibatkan terjadinya jenis inflasi ....", "options": ["Cost-push inflation", "Demand-pull inflation", "Imported inflation", "Hyperinflation", "Structural inflation"], "answer": [1], "why": "Demand-pull inflation terjadi karena dorongan kenaikan permintaan masyarakat yang melonjak tinggi sementara penawaran/produksi terbatas."},
 {"n": 13, "type": "single", "q": "Instrumen kebijakan fiskal yang digunakan pemerintah untuk mengatasi kesenjangan ekonomi dan redistribusi pendapatan adalah ....", "options": ["Penetapan tarif pajak progresif", "Pencetakan uang baru", "Operasi pasar terbuka", "Penetapan tingkat suku bunga diskonto", "Pemberian pinjaman luar negeri"], "answer": [0], "why": "Pajak progresif (tarif makin tinggi untuk tingkat pendapatan makin tinggi) berfungsi sebagai alat redistribusi pendapatan dalam kebijakan fiskal."},
 {"n": 14, "type": "multi", "q": "Pernyataan yang benar mengenai dampak devaluasi (penurunan nilai mata uang lokal secara sengaja terhadap mata uang asing) adalah .... (Pilih semua yang benar)", "options": ["Harga barang ekspor menjadi lebih murah di pasar luar negeri", "Harga barang impor di dalam negeri menjadi lebih mahal", "Dapat memicu peningkatan volume ekspor negara tersebut", "Mendorong masyarakat untuk lebih banyak mengonsumsi barang impor", "Defisiti neraca pembayaran diprediksi semakin membesar"], "answer": [0, 1, 2], "why": "Devaluasi membuat ekspor lebih murah/bersaing di luar negeri dan barang impor lebih mahal di dalam negeri, sehingga mendorong ekspor dan menekan impor."},
 {"n": 15, "type": "single", "q": "Negara A mampu memproduksi 10 unit kain atau 20 unit beras per hari. Negara B mampu memproduksi 15 unit kain atau 15 unit beras per hari. Berdasarkan Teori Keunggulan Komparatif David Ricardo ....", "options": ["Negara A sebaiknya berspesialisasi memproduksi beras", "Negara A sebaiknya berspesialisasi memproduksi kain", "Negara B sebaiknya berspesialisasi memproduksi beras", "Negara B tidak memiliki keunggulan apapun", "Kedua negara tidak perlu melakukan perdagangan internasional"], "answer": [0], "why": "Di negara A, $1 \text{ beras} = 0,5 \text{ kain}$. Di negara B, $1 \text{ beras} = 1 \text{ kain}$. Negara A memiliki biaya peluang lebih kecil dalam memproduksi beras, sehingga unggul secara komparatif pada beras."},
 {"n": 16, "type": "multi", "q": "Manakah pos-pos yang dicatat di sisi DEBET pada neraca pembayaran internasional? (Pilih semua yang benar)", "options": ["Impor barang dari luar negeri", "Pembayaran bunga utang ke luar negeri", "Penerimaan wisatawan asing ke dalam negeri", "Investasi penduduk dalam negeri ke luar negeri", "Penerimaan hibah dari luar negeri"], "answer": [0, 1, 3], "why": "Transaksi debet menyebabkan keluarnya devisa/uang ke luar negeri, yaitu impor barang, pembayaran bunga utang ke luar negeri, dan investasi ke luar negeri."},
 {"n": 17, "type": "single", "q": "Pak Budi membeli perlengkapan salon sebesar Rp5.000.000 secara tunai. Pengaruh transaksi ini terhadap persamaan dasar akuntansi adalah ....", "options": ["Aset (Perlengkapan) bertambah Rp5.000.000 dan Aset (Kas) berkurang Rp5.000.000", "Aset bertambah Rp5.000.000 dan Liabilitas bertambah Rp5.000.000", "Aset berkurang Rp5.000.000 dan Ekuitas berkurang Rp5.000.000", "Aset bertambah Rp5.000.000 dan Ekuitas bertambah Rp5.000.000", "Liabilitas berkurang Rp5.000.000 dan Ekuitas bertambah Rp5.000.000"], "answer": [0], "why": "Pembelian perlengkapan secara tunai mengubah komposisi aset: Perlengkapan (+) dan Kas (-), total aset tidak berubah."},
 {"n": 18, "type": "multi", "q": "Diterima pelunasan piutang usaha dari pelanggan sebesar Rp3.000.000. Pencatatan jurnal umum yang tepat adalah .... (Pilih semua yang benar)", "options": ["Kas dicatat di Debet sebesar Rp3.000.000", "Piutang Usaha dicatat di Kredit sebesar Rp3.000.000", "Pendapatan Jasa dicatat di Kredit sebesar Rp3.000.000", "Piutang Usaha dicatat di Debet sebesar Rp3.000.000", "Kas dicatat di Kredit sebesar Rp3.000.000"], "answer": [0, 1], "why": "Pelunasan piutang menambah Kas (Debet) dan mengurangi Piutang Usaha (Kredit)."},
 {"n": 19, "type": "single", "q": "Pada akhir periode, akun Perlengkapan di neraca saldo mencatat Rp8.000.000. Hasil inventarisasi fisik menunjukkan perlengkapan yang masih tersisa sebesar Rp3.000.000. Jurnal penyesuaian yang harus dibuat adalah ....", "options": ["Beban Perlengkapan (D) Rp5.000.000 ; Perlengkapan (K) Rp5.000.000", "Perlengkapan (D) Rp5.000.000 ; Beban Perlengkapan (K) Rp5.000.000", "Beban Perlengkapan (D) Rp3.000.000 ; Perlengkapan (K) Rp3.000.000", "Perlengkapan (D) Rp3.000.000 ; Beban Perlengkapan (K) Rp3.000.000", "Beban Perlengkapan (D) Rp8.000.000 ; Perlengkapan (K) Rp8.000.000"], "answer": [0], "why": "Perlengkapan yang terpakai menjadi beban $= 8.000.000 - 3.000.000 = 5.000.000$. Jurnalnya: Beban Perlengkapan (Debet) Rp5.000.000 dan Perlengkapan (Kredit) Rp5.000.000."},
 {"n": 20, "type": "multi", "q": "Manakah komponen akun yang terdapat di dalam Laporan Laba Rugi perusahaan jasa? (Pilih semua yang benar)", "options": ["Pendapatan Jasa", "Beban Gaji", "Beban Penyusutan Peralatan", "Peralatan", "Modal Pemilik"], "answer": [0, 1, 2], "why": "Laporan Laba Rugi memuat seluruh pendapatan dan beban. Peralatan tergolong Aset (Neraca) dan Modal Pemilik tergolong Ekuitas (Laporan Perubahan Ekuitas/Neraca)."},
 {"n": 21, "type": "single", "q": "Perusahaan Dagang 'Sentosa' membeli barang dagangan sebesar Rp10.000.000 dengan syarat pembayaran 2/10, n/30. Jika pembayarannya dilakukan pada hari ke-8 setelah tanggal transaksi, jumlah yang harus dibayar adalah ....", "options": ["Rp10.000.000", "Rp9.800.000", "Rp9.500.000", "Rp9.000.000", "Rp10.200.000"], "answer": [1], "why": "Syarat 2/10 berarti potongan 2% jika dibayar dalam jangka 10 hari. Karena dibayar hari ke-8, dapat potongan $2\% \times 10.000.000 = 200.000$. Yang dibayar $= 10.000.000 - 200.000 = \text{Rp}9.800.000$."},
 {"n": 22, "type": "single", "q": "Rumus untuk menghitung Harga Pokok Penjualan (HPP) pada perusahaan dagang adalah ....", "options": ["Persediaan Awal + Pembelian Bersih - Persediaan Akhir", "Persediaan Awal + Penjualan Bersih - Persediaan Akhir", "Pembelian + Beban Angkut Pembelian + Potongan Pembelian", "Persediaan Akhir + Pembelian Bersih - Persediaan Awal", "Penjualan Bersih - Laba Kotor"], "answer": [0], "why": "$HPP = \text{Persediaan Awal} + \text{Pembelian Bersih} - \text{Persediaan Akhir}$."},
 {"n": 23, "type": "multi", "q": "Manakah prinsip dasar operasional kegiatan koperasi menurut UU di Indonesia? (Pilih semua yang benar)", "options": ["Keanggotaan bersifat sukarela dan terbuka", "Pengelolaan dilakukan secara demokratis", "Pembagian SHU dilakukan secara adil sebanding dengan besarnya jasa usaha masing-masing anggota", "Pemberian balas jasa yang terbatas terhadap modal", "Keuntungan pembagian berdasarkan besarnya kepemilikan saham terbesar"], "answer": [0, 1, 2, 3], "why": "Opsi A, B, C, D merupakan prinsip koperasi. Opsi E adalah prinsip Perseroan Terbatas (PT)."},
 {"n": 24, "type": "single", "q": "Koperasi 'Maju Bersama' memperoleh SHU sebesar Rp40.000.000. Alokasi SHU untuk Jasa Anggota/Simpanan adalah 20% dan Jasa Penjualan/Usaha 30%. Total simpanan seluruh anggota Rp100.000.000 dan total penjualan koperasi Rp200.000.000. Jika Pak Ali memiliki simpanan Rp5.000.000 dan berbelanja di koperasi sebesar Rp10.000.000, maka SHU yang diterima Pak Ali adalah ....", "options": ["Rp400.000", "Rp600.000", "Rp1.000.000", "Rp1.200.000", "Rp1.500.000"], "answer": [2], "why": "Jasa Simpanan Pak Ali $= (5/100) \times (20\% \times 40.000.000) = 5/100 \times 8.000.000 = 400.000$. Jasa Penjualan Pak Ali $= (10/200) \times (30\% \times 40.000.000) = 1/20 \times 12.000.000 = 600.000$. Total SHU $= 400.000 + 600.000 = \text{Rp}1.000.000$."},
 {"n": 25, "type": "multi", "q": "Manakah berikut ini yang termasuk jenis pajak pusat (dikelola oleh Pemerintah Pusat/DJP)? (Pilih semua yang benar)", "options": ["Pajak Penghasilan (PPh)", "Pajak Pertambahan Nilai (PPN)", "Pajak Kendaraan Bermotor (PKB)", "Pajak Bumi dan Bangunan sektor Perkebunan, Perhutanan, Pertambangan (PBB-P3)", "Pajak Restoran dan Hotel"], "answer": [0, 1, 3], "why": "PPh, PPN, dan PBB-P3 adalah Pajak Pusat. Pajak Kendaraan Bermotor dikelola Provinsi, sedangkan Pajak Restoran & Hotel dikelola Kabupaten/Kota."}
];

const passages={
 "1": ["Studi Kasus 1 — Krisis Ekonomi, Inflasi, dan Kebijakan", "Krisis ekonomi global dan dinamika pasar domestik menuntut pemahaman mendalam terkait penanganan inflasi, krisis cadangan devisa, biaya peluang, serta mekaniisme pasar."],
 "9": ["Studi Kasus 2 — Makroekonomi & Kebijakan Fiskal-Moneter", "Perhitungan pendapatan nasional, pengendalian inflasi melalui kebijakan fiskal dan moneter, serta prinsip perdagangan internasional menjadi pilar penting stabilitas ekonomi."],
 "17": ["Studi Kasus 3 — Akuntansi Dasar, Perusahaan Dagang, & Koperasi", "Sistem akuntansi mencatat keuangan secara rinci mulai dari persamaan dasar, jurnal, laporan keuangan, hingga perhitungan SHU Koperasi dan perpajakan nasional."]
};

function sameSet(a,b){return a.length===b.length&&[...a].sort((x,y)=>x-y).every((v,i)=>v===[...b].sort((x,y)=>x-y)[i])}
function letters(a){return a.map(i=>String.fromCharCode(65+i)).join(', ')}
function selected(q){return [...document.querySelectorAll(`input[name="q${q.n}"]:checked`)].map(x=>+x.value)}

function render(){
 const root=document.getElementById('quiz');let last=-1;
 questions.forEach((q,idx)=>{
  const group=Object.keys(passages).map(Number).filter(n=>n<=q.n).pop();
  const card=document.createElement('section');card.className='card';
  if(group!==last){card.innerHTML+=`<div class="passage"><h2>${passages[group][0]}</h2>${passages[group][1]}</div>`;last=group}
  const multi=q.answer.length>1;
  card.innerHTML+=`<div class="qhead"><div class="num">Soal ${q.n}/25</div><div class="small">${multi?'Pilih semua yang benar':'Pilih satu jawaban'}</div></div><div class="question">${q.q}</div><div class="hint">${multi?'Bisa lebih dari satu pilihan.':'Hanya satu pilihan.'}</div>`;
  q.options.forEach((op,i)=>{const id=`q${q.n}_${i}`;card.innerHTML+=`<label class="option" id="opt-${id}"><input type="${multi?'checkbox':'radio'}" name="q${q.n}" value="${i}"><span><b>${String.fromCharCode(65+i)}.</b> ${op}</span></label>`});
  card.innerHTML+=`<button class="primary" onclick="checkQ(${idx})">Periksa Jawaban</button><div id="fb-${q.n}" class="feedback"></div>`;
  root.appendChild(card);
 });
}

function checkQ(idx){
 const q=questions[idx],sel=selected(q),ok=sameSet(sel,q.answer),fb=document.getElementById('fb-'+q.n);
 q.options.forEach((_,i)=>{const el=document.getElementById(`opt-q${q.n}_${i}`);el.classList.remove('correct','wrong');if(q.answer.includes(i))el.classList.add('correct');else if(sel.includes(i))el.classList.add('wrong')});
 fb.className='feedback show '+(ok?'good':'bad');
 fb.innerHTML=(ok?'✓ <b>BENAR</b>':'✗ <b>SALAH</b>')+`<br><b>Jawaban benar:</b> ${letters(q.answer)}<br><b>Pembahasan:</b> ${q.why}`;
 update();
}

function update(){const n=questions.filter(q=>selected(q).length).length;document.getElementById('counter').textContent=`${n}/25 dijawab`;document.getElementById('bar').style.width=(n/25*100)+'%'}
function finishQuiz(){let c=0;questions.forEach(q=>{if(sameSet(selected(q),q.answer))c++});const p=Math.round(c/25*100);const r=document.getElementById('result');r.className='result show';r.innerHTML=`<div class="small">HASIL AKHIR</div><div class="score">${c}/25</div><h2>${p}%</h2><p>Jawaban yang belum diisi dihitung salah.</p>`;r.scrollIntoView({behavior:'smooth'})}
function resetQuiz(){if(confirm('Reset semua jawaban?'))location.reload()}

document.addEventListener('change',update);render();
</script>
</body>
</html>
